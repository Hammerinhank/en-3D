<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fauteuil en 3D</title>
<style>
:root{--bg1:#f4efe6;--bg2:#d9cdb8;--fg:#3a2a1c;--btn:#ffffffcc;--bd:#00000022;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2420;--bg2:#15110e;--fg:#eadfce;--btn:#ffffff14;--bd:#ffffff2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a2420;--bg2:#15110e;--fg:#eadfce;--btn:#ffffff14;--bd:#ffffff2e;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2));color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
button:active{transform:scale(.96)}
#hint{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div id="hint">Glisser pour tourner · molette ou pincement pour zoomer</div>
<div id="ui">
<button data-v="face">Face</button><button data-v="profil">Profil</button><button data-v="dos">Dos</button><button data-v="dessus">Dessus</button><button id="auto">Rotation auto</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,1,1,1000);
camera.position.set(120,95,140);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,48,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.52;controls.minDistance=60;controls.maxDistance=350;controls.update();

scene.add(new THREE.HemisphereLight(0xfff4e0,0x6b5a46,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(80,160,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:10,far:400});
scene.add(sun);

const wood=new THREE.MeshStandardMaterial({color:0x5a2b18,roughness:.45,metalness:.05});
const velvet=new THREE.MeshStandardMaterial({color:0xd8b648,roughness:1});
const brass=new THREE.MeshStandardMaterial({color:0xb48d3c,roughness:.35,metalness:.85});

// sol
const disc=new THREE.Mesh(new THREE.CircleGeometry(130,64),new THREE.MeshStandardMaterial({color:0x9c7a4c,roughness:.9}));
disc.rotation.x=-Math.PI/2;disc.receiveShadow=true;scene.add(disc);

const V=(a)=>new THREE.Vector3(a[0],a[1],a[2]);
function tube(pts,r){
  const c=new THREE.CatmullRomCurve3(pts.map(V));
  const m=new THREE.Mesh(new THREE.TubeGeometry(c,80,r,12,false),wood);
  m.castShadow=true;scene.add(m);return m;
}
function add(geo,mat,x,y,z,rx=0,ry=0){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,0);m.castShadow=true;scene.add(m);return m;
}
function nails(pts,place){
  const g=new THREE.SphereGeometry(.75,8,6);
  const im=new THREE.InstancedMesh(g,brass,pts.length);
  const d=new THREE.Object3D();
  pts.forEach((p,i)=>{place(d,p);d.updateMatrix();im.setMatrixAt(i,d.matrix);});
  return im;
}

// assise (x, y du shape ; avant = y négatif → z positif)
function seatShape(k){
  const s=new THREE.Shape();
  s.moveTo(-25*k,25*k);s.lineTo(25*k,25*k);s.lineTo(28*k,-22*k);
  s.quadraticCurveTo(0,-31*k,-28*k,-22*k);s.lineTo(-25*k,25*k);
  return s;
}
const seatS=seatShape(1);
const seat=new THREE.Mesh(new THREE.ExtrudeGeometry(seatS,{depth:7,bevelEnabled:true,bevelSize:1.2,bevelThickness:1.2,bevelSegments:3,curveSegments:24}),velvet);
seat.rotation.x=-Math.PI/2;seat.position.y=43;seat.castShadow=seat.receiveShadow=true;scene.add(seat);
const apron=new THREE.Mesh(new THREE.ExtrudeGeometry(seatShape(.97),{depth:6,bevelEnabled:false,curveSegments:24}),wood);
apron.rotation.x=-Math.PI/2;apron.position.y=37.5;apron.castShadow=true;scene.add(apron);
scene.add(nails(seatS.getSpacedPoints(110),(d,p)=>d.position.set(p.x,43.6,-p.y)));

// pieds arrière + montants du dossier (sabre continu)
const rear=[[0.5,-37],[14,-31],[32,-24],[46,-22],[66,-27],[82,-31],[92,-34]];
const front=[[50,22],[36,22.5],[22,24],[10,28],[2,32.5]];
[1,-1].forEach(s=>{
  tube(rear.map(([y,z])=>[25*s,y,z]),2.3);
  tube(front.map(([y,z])=>[27*s,y,z]),2.7);
  add(new THREE.SphereGeometry(2.8,16,12),wood,27*s,1.8,32.5);
  // montant d'accotoir sculpté
  add(new THREE.BoxGeometry(5,9,6),wood,27*s,50,22);
  // accotoir
  tube([[25*s,71,-31],[26*s,65,-18],[27*s,61,-4],[27*s,60,10],[27*s,58,20],[27*s,56,25]],1.9);
  // volute
  const t=add(new THREE.TorusGeometry(3.6,1.7,10,24,Math.PI*1.6),wood,27*s,56.5,26.5,0,Math.PI/2);
  t.rotation.z=Math.PI*0.5;
  add(new THREE.CylinderGeometry(3.2,3.2,3.4,20),wood,27*s+s*0.2,56.5,27.2,0,0).rotation.z=Math.PI/2;
});

// dossier : panneau capitonné incliné
const tilt=-0.23;
const g=new THREE.Group();g.position.set(0,67,-28);g.rotation.x=tilt;scene.add(g);
const ps=new THREE.Shape();
ps.moveTo(-22,-20);ps.lineTo(22,-20);ps.lineTo(22,17);ps.quadraticCurveTo(0,25,-22,17);ps.lineTo(-22,-20);
const pg=new THREE.ExtrudeGeometry(ps,{depth:4,bevelEnabled:true,bevelSize:.8,bevelThickness:.8,bevelSegments:3,curveSegments:24});
pg.translate(0,0,-2);
const panel=new THREE.Mesh(pg,velvet);panel.castShadow=true;g.add(panel);
g.add(nails(ps.getSpacedPoints(100),(d,p)=>d.position.set(p.x,p.y,3)));
// traverse basse
add(new THREE.BoxGeometry(46,4,3),wood,0,46,-23.2).rotation.x=tilt;
// traverse haute cintrée
tube([[-26,92,-34],[-13,94.8,-34.6],[0,96,-34.8],[13,94.8,-34.6],[26,92,-34]],3.2);
// volutes de la traverse
[1,-1].forEach(s=>add(new THREE.TorusGeometry(2.2,.8,8,20,Math.PI*1.7),wood,20*s,92.5,-31.6,0,0));

window.addEventListener('resize',fit);
function fit(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
fit();

// vues prédéfinies
const views={face:[0,60,190],profil:[190,60,0],dos:[0,70,-190],dessus:[0,230,40]};
let goal=null;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{goal=new THREE.Vector3(...views[b.dataset.v]);controls.autoRotate=false;});
const auto=document.getElementById('auto');
auto.onclick=()=>{controls.autoRotate=!controls.autoRotate;goal=null;};
controls.autoRotateSpeed=1.6;
renderer.domElement.addEventListener('pointerdown',()=>{goal=null;});

(function loop(){
  requestAnimationFrame(loop);
  if(goal){camera.position.lerp(goal,.08);if(camera.position.distanceTo(goal)<.5)goal=null;}
  controls.update();renderer.render(scene,camera);
})();
</script>
</body>
</html>
